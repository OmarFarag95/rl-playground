<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Splash Lab Showcase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* A fixed 1920×1080 film frame: dive on the left, the network and the learning curve on the right. */
:root{
  --bg:#EDF5F6; --panel:#FFFFFF; --ink:#0D2B35; --muted:#557079; --line:#C9DCE0;
  --sky:#DDF0F4; --water:#3FB1CC; --deep:#14799A; --board:#C99A4B; --deck:#B9C9CC; --accent:#D9481F; --bad:#B3261E; --drop:#0B5F80; --grass:#6FA85A; --dough:#F2DDA8; --wall:#CFE0E3; --gold:#E0A21B;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}
.frame{position:absolute;inset:0;padding:36px 48px 30px;display:grid;grid-template-columns:1088px 1fr;grid-template-rows:96px 1fr 44px;gap:22px 36px}
header{grid-column:1/3;display:flex;align-items:flex-end;gap:28px}
.brand{font:700 26px var(--display);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-bottom:10px}
#title{font:700 64px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;white-space:nowrap}
#subtitle{font:500 28px var(--body);color:var(--muted);padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.formula{font:500 24px var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 18px;white-space:nowrap;margin-bottom:4px}
.formula b{color:var(--accent);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden}
#stageWrap{position:relative;background:var(--sky);border-radius:8px;overflow:hidden;height:816px}
#stage{display:block;width:1088px;height:816px}
.tag{position:absolute;left:0;top:0;font:500 20px var(--body);color:var(--ink);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:2px 10px;border-radius:4px;white-space:nowrap;pointer-events:none}
.badge{position:absolute;left:20px;top:20px;font:600 22px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--panel);padding:6px 14px;border-radius:4px}
.badge.gold{background:var(--gold);color:var(--ink)}
.caption{position:absolute;left:20px;bottom:20px;right:20px;font:600 30px var(--display);letter-spacing:.02em;background:color-mix(in srgb,var(--panel) 90%,transparent);padding:8px 16px;border-radius:6px;width:max-content;max-width:calc(100% - 40px)}
.carded .tag,.carded .caption{display:none!important}
.caption{display:grid;gap:4px;font-size:26px}
.caption div{display:grid;grid-template-columns:18px 330px 110px auto;align-items:center;gap:10px}
.caption i{width:14px;height:14px;border-radius:50%}
.caption .now i{background:var(--accent)} .caption .best i{background:var(--gold)} .caption .first i{background:#8A9BA2}
.caption b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.caption em{font:500 20px var(--body);font-style:normal;color:var(--muted)}
.caption .now span,.caption .now b{color:var(--ink)}
.gtag{position:absolute;left:0;top:0;font:600 20px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:4px;white-space:nowrap;pointer-events:none}
.gtag.g1{background:#8A9BA2;color:#fff} .gtag.g2{background:var(--gold);color:var(--ink)}
.carded .gtag{display:none!important}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:color-mix(in srgb,var(--ink) 72%,transparent);color:#fff;text-align:center;padding:40px}
.card .k{font:600 30px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card .h{font:700 96px/1 var(--display);text-transform:uppercase;text-wrap:balance}
.card .s{font:500 32px var(--body);max-width:880px;opacity:.92}
.card .big{display:flex;gap:56px;margin-top:18px}
.card .big div{display:flex;flex-direction:column;align-items:center}
.card .big b{font:700 84px/1 var(--display)}
.card .big span{font:500 22px var(--body);opacity:.85}
.right{display:flex;flex-direction:column;gap:22px;min-width:0}
.right .panel{padding:14px 20px}
.ptitle{font:600 22px var(--display);letter-spacing:.07em;text-transform:uppercase;display:flex;gap:12px;align-items:baseline;white-space:nowrap}
.ptitle span{font:500 17px var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
#net{display:block;width:100%;height:404px;margin-top:4px}
#curve{display:block;width:100%;height:142px;margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.chips div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;display:flex;flex-direction:column}
.chips span{font:500 15px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chips b{font:700 40px/1.05 var(--display);font-variant-numeric:tabular-nums}
.timeline{grid-column:1/3;display:flex;align-items:center;gap:0;position:relative;padding:0 14px}
.timeline .rail{position:absolute;left:14px;right:14px;top:50%;height:4px;background:var(--line);border-radius:2px}
.timeline .fill{position:absolute;left:14px;top:50%;height:4px;background:var(--accent);border-radius:2px}
.timeline .dots{position:relative;display:flex;justify-content:space-between;width:100%}
.timeline .dot{display:flex;align-items:center;gap:8px;background:var(--bg);padding:0 8px;font:600 20px var(--display);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.timeline .dot i{width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--line)}
.timeline .dot.on{color:var(--ink)} .timeline .dot.on i{border-color:var(--accent);background:var(--accent)}

/* ----- vertical 1080×1920 (TikTok, Reels, Shorts) -----
   Kept clear of the app's overlays: the top ~110 px, a ~140 px strip on the right, and the bottom ~300 px. */
.hud{display:none}
.hook{display:none}
.vertical .hook{display:block;font:700 66px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink);margin-bottom:16px}
.vertical .hook span{color:var(--accent)}
.vertical .brand{display:none}
html.vertical,html.vertical body{width:1080px;height:1920px}
.vertical .frame{padding:118px 0 0;display:flex;flex-direction:column;gap:16px}
.vertical header{flex-direction:column;align-items:flex-start;gap:4px;padding:0 44px}
.vertical .brand{padding:0;font-size:26px}
.vertical #title{font-size:58px}
.vertical #subtitle{font-size:34px;white-space:nowrap;flex:none;line-height:1.2}
.vertical .formula{font-size:26px;padding:6px 14px;margin:6px 0 0}
.vertical #stageWrap{height:860px;border-radius:0}
.vertical #stage{width:1080px;height:860px}
.vertical .tag{font-size:24px}
.vertical .badge{font-size:26px}
.vertical .hud{display:block;position:absolute;right:20px;top:20px;font:500 26px var(--display);letter-spacing:.03em;text-transform:uppercase;text-align:right;background:color-mix(in srgb,var(--panel) 88%,transparent);padding:6px 14px;border-radius:6px;line-height:1.25}
.vertical .hud b{font-weight:700;color:var(--accent)}
.vertical .carded .hud{display:none}
.vertical .caption{font-size:30px}
.vertical .caption div{grid-template-columns:20px 360px 120px auto}
.vertical .caption em{font-size:22px}
.vertical .card .h{font-size:92px}
.vertical .card .s{font-size:36px}
.vertical .card .k{font-size:28px}
.vertical .gtag{font-size:24px}
.vertical .right{padding:0 150px 0 32px;gap:14px}
.vertical .ptitle{font-size:28px}
.vertical .ptitle span{font-size:22px}
.vertical #net{height:420px}
.vertical #curve{height:150px}
.vertical .chips,.vertical .timeline{display:none}
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="hook" id="hook"></div>
    <div class="brand">Splash Lab</div>
    <h1 id="title"></h1>
    <div id="subtitle"></div>
    <div class="formula">reward = <b id="formula"></b></div>
  </header>

  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <canvas id="flat" hidden></canvas>
    <div class="tag" hidden></div><div class="tag" hidden></div><div class="tag" hidden></div>
    <div id="badge" class="badge" hidden></div>
    <div id="caption" class="caption" hidden></div>
    <div id="hud" class="hud"></div>
    <div id="card" class="card" hidden></div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="ptitle">Policy network <span id="netNote"></span></div>
      <canvas id="net"></canvas>
    </div>
    <div class="panel">
      <div class="ptitle">Learning curve <span>average reward per update · <b style="color:var(--accent)">best</b> try</span></div>
      <canvas id="curve"></canvas>
    </div>
    <div class="chips">
      <div><span>Update</span><b id="cIter">0</b></div>
      <div><span>Practice dives</span><b id="cDives">0</b></div>
      <div><span id="cSplashL">Avg splash</span><b id="cSplash">–</b></div>
    </div>
  </div>

  <div class="timeline"><div class="rail"></div><div class="fill" id="tlFill"></div><div class="dots" id="dots"></div></div>
</div>
<script type="module" src="showcase.js"></script>
</body>
</html>
